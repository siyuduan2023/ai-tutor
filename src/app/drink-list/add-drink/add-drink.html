<form [formGroup]="addDrinkForm" (ngSubmit)="onSubmit()">
    <label for="name">Name: </label>
    <input id="name" type="text" formControlName="name" />

    <label for="description">Description: </label>
    <input id="description" type="description" formControlName="description" />

    <button mat-raised-button color="primary" type="submit" [disabled]="addDrinkForm.invalid">Save</button>
</form>
